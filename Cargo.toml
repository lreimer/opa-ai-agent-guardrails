edition = "2024"

[[bin]]
name = "check-policy"
path = "src/bin/check_policy.rs"

[dependencies]
anyhow = "1.0.100"
opa-wasm = { version = "0.3.2", features = ["loader"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "rt", "fs", "io-util"] }
